<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17171c" media="(prefers-color-scheme: dark)">
<title>우리집 가계부</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #f2f4f6;
  --surface: #ffffff;
  --fill: #f2f4f6;
  --fill-strong: #e5e8eb;
  --text: #191f28;
  --text-2: #4e5968;
  --muted: #8b95a1;
  --line: #f2f4f6;
  --accent: #3182f6;
  --accent-soft: #e8f3ff;
  --plus: #3182f6;
  --minus: #f04452;
  --warn: #f59f00;
  --warn-soft: #fff4e0;
  --scrim: rgba(0, 0, 0, .4);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17171c;
    --surface: #202027;
    --fill: #2c2c35;
    --fill-strong: #3a3a45;
    --text: #e4e4e5;
    --text-2: #b0b0b8;
    --muted: #7e7e87;
    --line: #2c2c35;
    --accent: #4d94f8;
    --accent-soft: #1f2b3d;
    --plus: #4d94f8;
    --minus: #f4646f;
    --warn: #f5b03a;
    --warn-soft: #3a2f1c;
    --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17171c; --surface: #202027; --fill: #2c2c35; --fill-strong: #3a3a45; --text: #e4e4e5;
  --text-2: #b0b0b8; --muted: #7e7e87; --line: #2c2c35; --accent: #4d94f8; --accent-soft: #1f2b3d;
  --plus: #4d94f8; --minus: #f4646f; --warn: #f5b03a; --warn-soft: #3a2f1c; --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 "Pretendard Variable", Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }
.wrap { max-width: 600px; margin: 0 auto; padding: 0 16px; }

/* 머리 */
header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); }
header.top .wrap { display: flex; align-items: center; height: 60px; gap: 4px; }
.month { display: flex; align-items: center; gap: 2px; flex: 1; }
.month h1 { font-size: 22px; font-weight: 700; margin: 0 4px; }
.month button {
  border: 0; background: none; width: 32px; height: 32px; border-radius: 10px; color: var(--muted);
  display: grid; place-items: center;
}
.month button:hover { background: var(--fill); }
.month button svg { width: 18px; height: 18px; }
.view-title { font-size: 22px; font-weight: 700; margin: 0; flex: 1; }
.text-btn { border: 0; background: none; color: var(--muted); font-size: 14px; padding: 8px 10px; border-radius: 10px; }
.text-btn:hover { background: var(--fill); }

main { padding: 4px 0 24px; }

/* 블록 */
.block { background: var(--surface); border-radius: 20px; padding: 22px 20px; margin-bottom: 12px; }
.block-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
.block-head h2 { font-size: 18px; font-weight: 700; margin: 0; }
.block-head .aside { color: var(--muted); font-size: 14px; }

/* 대표 숫자 */
.hero .label { color: var(--text-2); font-size: 15px; font-weight: 500; }
.hero .big { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; margin: 2px 0 2px; }
.hero .note { color: var(--muted); font-size: 13px; }
.hero .split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
.hero .split > div { background: var(--fill); border-radius: 14px; padding: 12px 14px; }
.hero .split .k { color: var(--muted); font-size: 13px; }
.hero .split .v { font-size: 17px; font-weight: 600; }
.plus { color: var(--plus); }
.minus { color: var(--minus); }

/* 목록 행 */
.rows { display: flex; flex-direction: column; }
.row {
  display: flex; align-items: center; gap: 14px; padding: 12px 0; width: 100%;
  border: 0; background: none; text-align: left;
}
button.row { border-radius: 12px; margin: 0 -8px; padding: 12px 8px; width: calc(100% + 16px); }
button.row:hover { background: var(--fill); }
.row .body { flex: 1; min-width: 0; }
.row .title { display: block; font-size: 16px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { display: block; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .end { text-align: right; flex-shrink: 0; }
.row .end .amt { font-size: 16px; font-weight: 600; }
.row .end .amt.move { color: var(--muted); font-weight: 500; }
.row .chev { color: var(--fill-strong); width: 18px; height: 18px; flex-shrink: 0; }
.row .pill { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--fill); color: var(--text-2); }
.row .pill.warn { background: var(--warn-soft); color: var(--warn); }

.avatar {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
  font-size: 15px; font-weight: 700; color: var(--c, var(--muted));
  background: color-mix(in srgb, var(--c, var(--muted)) 14%, transparent);
}
.avatar svg { width: 20px; height: 20px; }

.tags { display: inline-flex; gap: 4px; margin-left: 4px; vertical-align: 1px; }
.tag { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 6px; background: var(--fill); color: var(--muted); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }

/* 봉투 */
.env { padding: 12px 0; }
.env .line { display: flex; align-items: center; gap: 10px; }
.env .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
.env .name { flex: 1; font-weight: 500; }
.env .left { font-weight: 600; }
.env .left.over { color: var(--minus); }
.env .left.none { color: var(--muted); font-weight: 500; font-size: 14px; }
.env .track { height: 6px; background: var(--fill); border-radius: 999px; overflow: hidden; margin: 8px 0 4px 20px; }
.env .track i { display: block; height: 100%; border-radius: 999px; background: var(--c); }
.env .track.over i { background: var(--minus); }
.env .meta { font-size: 13px; color: var(--muted); margin-left: 20px; }
.alloc {
  width: 128px; text-align: right; padding: 8px 12px; border: 0; border-radius: 10px;
  background: var(--fill); font-weight: 600;
}
.alloc:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.totals { display: flex; justify-content: space-between; padding-top: 14px; color: var(--text-2); }
.totals + .totals { padding-top: 6px; }
.totals b { color: var(--text); }
.callout { border-radius: 14px; padding: 12px 14px; font-size: 14px; margin-top: 14px; }
.callout.bad { background: color-mix(in srgb, var(--minus) 10%, transparent); color: var(--minus); }
.callout.good { background: var(--accent-soft); color: var(--accent); }

/* 거래 */
.filters { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 12px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chip {
  border: 0; background: var(--surface); padding: 8px 14px; border-radius: 999px; font-size: 14px;
  font-weight: 500; color: var(--text-2); white-space: nowrap; flex-shrink: 0;
}
.chip[aria-pressed="true"] { background: var(--text); color: var(--surface); }
select.chip { appearance: none; padding-right: 14px; }
.search {
  width: 100%; padding: 12px 16px; border: 0; border-radius: 14px; background: var(--surface);
  margin-bottom: 10px;
}
.search::placeholder { color: var(--muted); }
.day-head { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); padding: 6px 0 2px; }
.day-head:first-child { padding-top: 0; }
.day + .day { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.empty { color: var(--muted); text-align: center; padding: 24px 0; font-size: 15px; }

/* 부채 */
.debt { padding: 14px 0; }
.debt + .debt { border-top: 1px solid var(--line); }
.debt .line { display: flex; align-items: baseline; gap: 8px; }
.debt .name { flex: 1; font-weight: 500; }
.debt .rate { font-size: 14px; font-weight: 600; color: var(--text-2); }
.debt .rate.high { color: var(--minus); }
.debt .bal { font-size: 20px; font-weight: 700; margin-top: 2px; }
.debt .track { height: 6px; background: var(--fill); border-radius: 999px; overflow: hidden; margin: 10px 0 6px; }
.debt .track i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.debt .meta { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.debt .link { border: 0; background: none; color: var(--accent); font-size: 13px; font-weight: 600; padding: 0; flex-shrink: 0; }

/* 메모 */
.note { padding: 10px 0; }
.note + .note { border-top: 1px solid var(--line); }
.note .item { font-weight: 600; font-size: 15px; }
.note .content { font-size: 14px; color: var(--text-2); white-space: pre-wrap; margin-top: 2px; }

/* 아래 탭 */
nav.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 6;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs .wrap { display: flex; }
nav.tabs button {
  flex: 1; border: 0; background: none; padding: 10px 0 10px; font-size: 11px; font-weight: 500; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--text); }

.fab {
  position: fixed; right: max(16px, calc(50vw - 284px)); bottom: calc(88px + env(safe-area-inset-bottom)); z-index: 6;
  height: 52px; padding: 0 20px 0 16px; border-radius: 999px; border: 0; background: var(--accent); color: #fff;
  font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 6px;
  box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 35%, transparent);
}
.fab svg { width: 20px; height: 20px; }

/* 시트 */
dialog {
  border: 0; padding: 0; background: var(--surface); color: var(--text);
  width: 100%; max-width: 600px; max-height: 92vh; margin: auto auto 0; border-radius: 24px 24px 0 0;
}
@media (min-width: 640px) { dialog { margin: auto; border-radius: 24px; max-width: 520px; } }
dialog::backdrop { background: var(--scrim); }
.sheet { padding: 24px 20px calc(20px + env(safe-area-inset-bottom)); overflow: auto; max-height: 92vh; }
.sheet h3 { margin: 0 0 18px; font-size: 20px; font-weight: 700; }
.amount-field { display: flex; align-items: baseline; gap: 4px; border-bottom: 2px solid var(--fill-strong); padding-bottom: 6px; margin-bottom: 18px; }
.amount-field:focus-within { border-color: var(--accent); }
.amount-field input { border: 0; background: none; font-size: 30px; font-weight: 700; width: 100%; padding: 0; outline: none; }
.amount-field input::placeholder { color: var(--fill-strong); }
.amount-field span { font-size: 22px; font-weight: 600; color: var(--text-2); }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: var(--muted); }
.form label.full { grid-column: 1 / -1; }
.form input, .form select, .form textarea {
  padding: 12px 14px; border: 0; border-radius: 12px; background: var(--fill); color: var(--text); width: 100%; font-size: 16px;
}
.form input:focus, .form select:focus, .form textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.form textarea { min-height: 76px; resize: vertical; }
.checks { display: flex; gap: 8px; grid-column: 1 / -1; }
.toggle { flex: 1; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.toggle span {
  display: block; text-align: center; padding: 11px 0; border-radius: 12px; background: var(--fill);
  color: var(--text-2); font-size: 15px; font-weight: 500;
}
.toggle input:checked + span { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.toggle input:focus-visible + span { outline: 2px solid var(--accent); }
.seg { display: flex; background: var(--fill); border-radius: 12px; padding: 4px; margin-bottom: 16px; }
.seg button { flex: 1; border: 0; background: none; padding: 9px 0; border-radius: 9px; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.hint { font-size: 13px; color: var(--accent); min-height: 18px; grid-column: 1 / -1; margin-top: -4px; font-weight: 500; }
.actions { display: flex; gap: 8px; margin-top: 22px; }
.btn { border: 0; background: var(--fill); padding: 15px 18px; border-radius: 14px; font-weight: 600; font-size: 16px; color: var(--text-2); }
.btn.primary { background: var(--accent); color: #fff; flex: 1; }
.btn.danger { color: var(--minus); background: none; padding-left: 4px; padding-right: 4px; }
.btn.ghost { background: none; color: var(--accent); padding-left: 0; }
.btn:disabled { opacity: .5; cursor: default; }

/* 로그인 */
.login { max-width: 400px; margin: 18vh auto 0; }
.login h1 { font-size: 26px; font-weight: 700; margin: 0 0 6px; }
.login p { color: var(--text-2); margin: 0 0 28px; }
.login form { display: flex; flex-direction: column; gap: 10px; }
.login input { padding: 16px; border: 0; border-radius: 14px; background: var(--surface); font-size: 17px; }
.login input:focus { outline: 2px solid var(--accent); }
.msg { font-size: 14px; color: var(--text-2); min-height: 22px; margin-top: 8px; }
.msg.error { color: var(--minus); }

.toast {
  position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translate(-50%, 8px);
  background: #333d4b; color: #fff; padding: 12px 18px; border-radius: 14px; font-size: 15px; font-weight: 500; z-index: 20;
  opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.placeholder { text-align: center; color: var(--muted); padding: 40px 16px; }
.placeholder b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
</style>
</head>
<body>

<div id="login" class="wrap hidden">
  <div class="login">
    <h1>우리집 가계부</h1>
    <p>등록된 이메일로 로그인 링크를 보내 드려요.</p>
    <form id="login-form">
      <input id="login-email" type="email" required placeholder="이메일 주소" autocomplete="email">
      <button class="btn primary" type="submit">로그인 링크 받기</button>
    </form>
    <div id="login-msg" class="msg"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="wrap">
      <div class="month" id="month-picker">
        <button type="button" data-step="-1" aria-label="이전 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <h1 id="month-label" class="num"></h1>
        <button type="button" data-step="1" aria-label="다음 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <h1 class="view-title hidden" id="view-title"></h1>
      <button class="text-btn" id="logout" type="button">로그아웃</button>
    </div>
  </header>

  <main class="wrap">
    <section class="view" id="view-home">
      <div class="block hero" id="hero"></div>
      <div class="block">
        <div class="rows" id="summary-rows"></div>
      </div>
      <div class="block">
        <div class="block-head"><h2>봉투</h2><span class="aside num" id="home-left"></span></div>
        <div id="home-envelopes"></div>
      </div>
      <div class="block">
        <div class="block-head"><h2>최근 거래</h2></div>
        <div class="rows" id="home-recent"></div>
      </div>
    </section>

    <section class="view hidden" id="view-tx">
      <input class="search" id="tx-search" type="search" placeholder="내용, 메모, 태그 검색">
      <div class="filters" id="tx-type-chips">
        <button class="chip" data-type="" aria-pressed="true">전체</button>
        <button class="chip" data-type="지출" aria-pressed="false">지출</button>
        <button class="chip" data-type="수입" aria-pressed="false">수입</button>
        <button class="chip" data-type="이동" aria-pressed="false">이동</button>
        <button class="chip" data-type="review" aria-pressed="false">검토 필요</button>
        <select class="chip" id="tx-envelope"><option value="">모든 봉투</option></select>
      </div>
      <div class="block" id="tx-days"></div>
    </section>

    <section class="view hidden" id="view-budget">
      <div class="block">
        <div class="block-head"><h2>봉투별 배정액</h2><span class="aside">숫자를 눌러 고쳐요</span></div>
        <div id="budget-list"></div>
        <div class="totals"><span>배정 합계</span><b class="num" id="budget-total"></b></div>
        <div class="totals"><span>예상 월수입</span><input class="alloc num" id="expected-income" inputmode="numeric" aria-label="예상 월수입"></div>
        <div id="budget-callout"></div>
      </div>
      <button class="btn ghost" id="copy-budget" type="button">지난달 배정 복사하기</button>
    </section>

    <section class="view hidden" id="view-debt">
      <div class="block hero" id="debt-hero"></div>
      <div class="block">
        <div class="block-head"><h2>금리 높은 순</h2></div>
        <div id="debt-list"></div>
      </div>
    </section>

    <section class="view hidden" id="view-notes">
      <div id="notes-list"></div>
    </section>

    <section class="view hidden" id="view-chores">
      <div class="block placeholder"><b>집안일</b>준비 중이에요. 가계부가 자리 잡으면 여기에 붙일게요.</div>
    </section>
  </main>

  <button class="fab" id="add-tx" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>기록하기
  </button>

  <nav class="tabs">
    <div class="wrap">
      <button type="button" data-view="home" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3.5 10.2 12 3.5l8.5 6.7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg>홈</button>
      <button type="button" data-view="tx">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>내역</button>
      <button type="button" data-view="budget">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="14" rx="2.5"/><path d="M3.5 8l8.5 5.5L20.5 8"/></svg>봉투</button>
      <button type="button" data-view="debt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>부채</button>
      <button type="button" data-view="notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7" stroke-linecap="round"/></svg>메모</button>
      <button type="button" data-view="chores">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>집안일</button>
    </div>
  </nav>
</div>

<dialog id="tx-dialog">
  <form class="sheet" id="tx-form" method="dialog">
    <h3 id="tx-dialog-title">기록하기</h3>
    <div class="seg" id="f-type">
      <button type="button" data-v="지출" aria-pressed="true">지출</button>
      <button type="button" data-v="수입" aria-pressed="false">수입</button>
      <button type="button" data-v="이동" aria-pressed="false">이동</button>
    </div>
    <div class="amount-field">
      <input id="f-amount" type="text" inputmode="numeric" required placeholder="0" class="num" aria-label="금액"><span>원</span>
    </div>
    <div class="form">
      <label class="full">내용<input id="f-desc" required autocomplete="off" placeholder="예: 쿠팡이츠 마라탕"></label>
      <div class="hint" id="f-hint"></div>
      <label>날짜<input id="f-date" type="date" required></label>
      <label>봉투<select id="f-envelope"><option value="">없음</option></select></label>
      <label>중분류<input id="f-cat" list="dl-cat" autocomplete="off"></label>
      <label>소분류<input id="f-sub" list="dl-sub" autocomplete="off"></label>
      <label class="full">결제수단<input id="f-pay" list="dl-pay" autocomplete="off"></label>
      <label id="f-debt-wrap" class="full hidden">대출<select id="f-debt"><option value="">선택 안 함</option></select></label>
      <label class="full">태그 (쉼표로 구분)<input id="f-tags" list="dl-tags" autocomplete="off" placeholder="이사, 사이드 프로젝트"></label>
      <label class="full">메모<textarea id="f-memo"></textarea></label>
      <div class="checks">
        <label class="toggle"><input id="f-review" type="checkbox"><span>검토 필요</span></label>
        <label class="toggle"><input id="f-oneoff" type="checkbox"><span>일회성</span></label>
      </div>
    </div>
    <div class="actions">
      <button class="btn danger hidden" id="tx-delete" type="button">삭제</button>
      <button class="btn" type="button" id="tx-cancel">닫기</button>
      <button class="btn primary" type="submit" id="tx-save">저장</button>
    </div>
  </form>
</dialog>

<dialog id="debt-dialog">
  <form class="sheet" id="debt-form" method="dialog">
    <h3 id="debt-dialog-title">잔액 갱신</h3>
    <div class="amount-field">
      <input id="d-balance" inputmode="numeric" class="num" required aria-label="현재 잔액"><span>원</span>
    </div>
    <div class="form">
      <label>다음 납부일<input id="d-next" type="date"></label>
      <label>월 납입액<input id="d-pay" inputmode="numeric" class="num"></label>
      <label class="full">메모<textarea id="d-memo"></textarea></label>
    </div>
    <div class="actions">
      <button class="btn" type="button" id="debt-cancel">닫기</button>
      <button class="btn primary" type="submit">저장</button>
    </div>
  </form>
</dialog>

<datalist id="dl-pay"></datalist>
<datalist id="dl-cat"></datalist>
<datalist id="dl-sub"></datalist>
<datalist id="dl-tags"></datalist>

<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';

const SUPABASE_URL = 'https://twrcgrflwvwljdyhxuwr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_vPIV6UrupvcFQUEvp_be3w_VkcjhQAT';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const fmt = n => Math.round(Number(n || 0)).toLocaleString('ko-KR');
const won = n => (n == null ? '-' : fmt(n) + '원');
const signedWon = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n)) + '원';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const parseAmount = s => Number(String(s).replace(/[^\d]/g, '')) || 0;
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const weekday = iso => '일월화수목금토'[new Date(iso + 'T00:00:00').getDay()];
const mmdd = iso => iso ? `${Number(iso.slice(5, 7))}/${Number(iso.slice(8, 10))}` : '';

const ENV_COLORS = {
  '식비': '#ff8a3d', '교통': '#3182f6', '생활·주거': '#00b386', '건강·의료': '#ff5c8a', '여가·모임': '#8b5cf6',
  '쇼핑·자기계발': '#e5a400', '고정비': '#5f6b7a', '부채상환': '#12a5b8', '비상금': '#7a8794', '기타': '#a3acb6',
};
const envColor = name => ENV_COLORS[name] || '#8b95a1';

const ICONS = {
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  move: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>',
};

const state = {
  month: today().slice(0, 7),
  view: 'home',
  envelopes: [],
  rules: [],
  debts: [],
  tx: [],
  budgets: [],
  summary: null,
  filter: { type: '', envelope: '', q: '' },
  editing: null,
  formType: '지출',
  expectedIncome: 0,
};

function monthRange(m) {
  const [y, mo] = m.split('-').map(Number);
  const next = mo === 12 ? `${y + 1}-01` : `${y}-${pad(mo + 1)}`;
  return { start: `${m}-01`, end: `${next}-01` };
}
function shiftMonth(m, step) {
  const [y, mo] = m.split('-').map(Number);
  const d = new Date(y, mo - 1 + step, 1);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
}
function monthName(m) {
  const [y, mo] = m.split('-').map(Number);
  return (y === new Date().getFullYear() ? '' : `${y}년 `) + `${mo}월`;
}

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}
function fail(err) {
  console.error(err);
  toast('문제가 생겼어요: ' + (err.message || err));
}

// 로그인 ---------------------------------------------------------------

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  const { data: ok, error } = await sb.rpc('is_member');
  if (error) return fail(error);
  if (!ok) {
    showLogin(`${session.user.email}은 등록되지 않은 이메일이에요.`, true);
    await sb.auth.signOut();
    return;
  }
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  await loadStatic();
  await loadMonth();
}

function showLogin(msg = '', error = false) {
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  const m = $('#login-msg');
  m.textContent = msg;
  m.classList.toggle('error', error);
}

$('#login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('#login-email').value.trim();
  const btn = e.submitter;
  btn.disabled = true;
  const redirect = location.origin + location.pathname;
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: redirect } });
  btn.disabled = false;
  if (error) return showLogin(error.message, true);
  showLogin('메일함을 확인해 주세요. 링크를 누르면 바로 들어와요.');
});

$('#logout').addEventListener('click', async () => {
  await sb.auth.signOut();
  showLogin();
});

sb.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_IN' && $('#app').classList.contains('hidden')) start();
});

// 데이터 ---------------------------------------------------------------

async function loadStatic() {
  const [env, rules, debts, dl, settings] = await Promise.all([
    sb.from('envelopes').select('*').order('sort_order'),
    sb.from('rules').select('*'),
    sb.from('debts').select('*'),
    sb.from('transactions').select('payment_method, category, subcategory, tags').order('date', { ascending: false }).limit(1000),
    sb.from('settings').select('*'),
  ]);
  for (const r of [env, rules, debts, dl, settings]) if (r.error) throw r.error;
  const setting = Object.fromEntries(settings.data.map(r => [r.key, r.value]));
  state.expectedIncome = Number(setting.expected_monthly_income || 0);
  state.envelopes = env.data;
  state.rules = rules.data.sort((a, b) => b.keyword.length - a.keyword.length);
  state.debts = debts.data;

  const uniq = key => [...new Set(dl.data.map(r => r[key]).filter(Boolean))].sort();
  fillDatalist('#dl-pay', uniq('payment_method'));
  fillDatalist('#dl-cat', uniq('category'));
  fillDatalist('#dl-sub', uniq('subcategory'));
  fillDatalist('#dl-tags', [...new Set(dl.data.flatMap(r => r.tags || []))].sort());

  const opts = state.envelopes.map(e => `<option>${esc(e.name)}</option>`).join('');
  $('#f-envelope').innerHTML = '<option value="">없음</option>' + opts;
  $('#tx-envelope').innerHTML = '<option value="">모든 봉투</option>' + opts;
  $('#f-debt').innerHTML = '<option value="">선택 안 함</option>' +
    state.debts.map(d => `<option value="${esc(d.id)}">${esc(d.id)} · ${esc(d.product)}</option>`).join('');
}

function fillDatalist(sel, values) {
  $(sel).innerHTML = values.map(v => `<option value="${esc(v)}">`).join('');
}

async function loadMonth() {
  $('#month-label').textContent = monthName(state.month);
  const { start, end } = monthRange(state.month);
  const [tx, budgets, summary, debts] = await Promise.all([
    sb.from('transactions').select('*').gte('date', start).lt('date', end)
      .order('date', { ascending: false }).order('id', { ascending: false }),
    sb.from('monthly_envelope_summary').select('*').eq('month', start),
    sb.from('monthly_summary').select('*').eq('month', start).maybeSingle(),
    sb.from('debts').select('*'),
  ]);
  for (const r of [tx, budgets, summary, debts]) if (r.error) return fail(r.error);
  state.tx = tx.data.sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  state.budgets = budgets.data;
  state.summary = summary.data;
  state.debts = debts.data;
  render();
}

// 화면 ---------------------------------------------------------------

function render() {
  renderHome();
  renderTx();
  renderBudget();
  renderDebt();
}

function envelopeRows() {
  const spent = {};
  for (const t of state.tx) if (t.type === '지출' && t.envelope) spent[t.envelope] = (spent[t.envelope] || 0) + Number(t.amount);
  const byName = Object.fromEntries(state.budgets.map(b => [b.envelope, b]));
  return state.envelopes.map(e => {
    const b = byName[e.name];
    const available = b ? Number(b.available) : 0;
    const s = spent[e.name] || 0;
    return { name: e.name, available, spent: s, remaining: available - s };
  });
}

function envHtml(r, editable = false) {
  const pct = r.available > 0 ? Math.min(100, (r.spent / r.available) * 100) : 0;
  const over = r.available > 0 && r.spent > r.available;
  let right;
  if (editable) {
    right = `<input class="alloc num" data-env="${esc(r.name)}" inputmode="numeric" value="${r.available ? fmt(r.available) : ''}" placeholder="0" aria-label="${esc(r.name)} 배정액">`;
  } else if (!r.available) {
    right = `<span class="left none num">${won(r.spent)} 씀</span>`;
  } else {
    right = `<span class="left num ${over ? 'over' : ''}">${over ? fmt(-r.remaining) + '원 초과' : fmt(r.remaining) + '원 남음'}</span>`;
  }
  const meta = r.available ? `${won(r.spent)} / ${won(r.available)}` : (editable ? `${won(r.spent)} 씀` : '배정 없음');
  return `<div class="env" style="--c:${envColor(r.name)}">
    <div class="line"><span class="dot"></span><span class="name">${esc(r.name)}</span>${right}</div>
    ${r.available ? `<div class="track ${over ? 'over' : ''}"><i style="width:${pct}%"></i></div>` : ''}
    <div class="meta num">${meta}</div>
  </div>`;
}

function renderHome() {
  const s = state.summary || {};
  const income = Number(s.income || 0), expense = Number(s.expense || 0);
  const incomeR = Number(s.income_regular || 0), expenseR = Number(s.expense_regular || 0);
  const net = income - expense, netR = incomeR - expenseR;
  const hasOneOff = net !== netR;
  $('#hero').innerHTML = `
    <div class="label">${monthName(state.month)} 평소 수지</div>
    <div class="big num ${netR < 0 ? 'minus' : ''}">${signedWon(netR)}</div>
    <div class="note num">${hasOneOff ? `이사 같은 일회성 거래를 포함하면 ${signedWon(net)}` : '일회성 거래 없음'}</div>
    <div class="split">
      <div><div class="k">들어온 돈</div><div class="v num">${won(incomeR)}</div></div>
      <div><div class="k">나간 돈</div><div class="v num">${won(expenseR)}</div></div>
    </div>`;

  const debtTotal = state.debts.reduce((a, d) => a + Number(d.balance || 0), 0);
  const review = Number(s.review_count || 0);
  $('#summary-rows').innerHTML = `
    <button class="row" type="button" data-goto="review">
      <span class="avatar" style="--c:var(--warn)">!</span>
      <span class="body"><span class="title">확인할 거래</span></span>
      <span class="pill ${review ? 'warn' : ''} num">${review}건</span>${ICONS.chev}
    </button>
    <button class="row" type="button" data-goto="debt">
      <span class="avatar" style="--c:${envColor('부채상환')}">빚</span>
      <span class="body"><span class="title">남은 부채</span><span class="sub num">이번 달 ${won(s.debt_repaid || 0)} 상환</span></span>
      <span class="end"><span class="amt num">${won(debtTotal)}</span></span>${ICONS.chev}
    </button>`;

  const rows = envelopeRows();
  const budgeted = rows.filter(r => r.available);
  const leftTotal = budgeted.reduce((a, r) => a + r.remaining, 0);
  $('#home-left').textContent = !budgeted.length ? ''
    : leftTotal < 0 ? `${fmt(-leftTotal)}원 초과` : `${fmt(leftTotal)}원 남음`;
  $('#home-envelopes').innerHTML = rows.filter(r => r.available || r.spent).map(r => envHtml(r)).join('')
    || '<div class="empty">이번 달 기록이 없어요</div>';
  $('#home-recent').innerHTML = state.tx.slice(0, 5).map(txHtml).join('') || '<div class="empty">거래가 없어요</div>';
}

function txHtml(t) {
  let avatar, amt;
  if (t.type === '수입') {
    avatar = `<span class="avatar" style="--c:var(--plus)">${ICONS.plus}</span>`;
    amt = `<span class="amt num plus">+${fmt(t.amount)}원</span>`;
  } else if (t.type === '이동') {
    avatar = `<span class="avatar">${ICONS.move}</span>`;
    amt = `<span class="amt num move">${fmt(t.amount)}원</span>`;
  } else {
    avatar = `<span class="avatar" style="--c:${envColor(t.envelope)}">${esc((t.envelope || '?').slice(0, 1))}</span>`;
    amt = `<span class="amt num">−${fmt(t.amount)}원</span>`;
  }
  const sub = [t.subcategory || t.category, t.payment_method].filter(Boolean).join(' · ');
  const tags = [
    t.needs_review ? '<span class="tag warn">확인</span>' : '',
    t.one_off ? '<span class="tag">일회성</span>' : '',
  ].join('');
  return `<button class="row" type="button" data-id="${esc(t.id)}">
    ${avatar}
    <span class="body"><span class="title">${esc(t.description)}</span><span class="sub">${esc(sub)}${tags ? `<span class="tags">${tags}</span>` : ''}</span></span>
    <span class="end">${amt}</span>
  </button>`;
}

function renderTx() {
  const { type, envelope, q } = state.filter;
  const needle = q.trim().toLowerCase();
  const rows = state.tx.filter(t =>
    (!type || (type === 'review' ? t.needs_review : t.type === type)) &&
    (!envelope || t.envelope === envelope) &&
    (!needle || `${t.description} ${t.memo || ''} ${(t.tags || []).join(' ')}`.toLowerCase().includes(needle)));
  const days = new Map();
  for (const t of rows) {
    if (!days.has(t.date)) days.set(t.date, []);
    days.get(t.date).push(t);
  }
  $('#tx-days').innerHTML = [...days].map(([d, list]) => {
    const out = list.filter(t => t.type === '지출').reduce((a, t) => a + Number(t.amount), 0);
    return `<div class="day">
      <div class="day-head"><span>${mmdd(d)} ${weekday(d)}요일</span><span class="num">${out ? '−' + fmt(out) + '원' : ''}</span></div>
      <div class="rows">${list.map(txHtml).join('')}</div>
    </div>`;
  }).join('') || '<div class="empty">조건에 맞는 거래가 없어요</div>';
}

function renderBudget() {
  const rows = envelopeRows();
  $('#budget-list').innerHTML = rows.map(r => envHtml(r, true)).join('');
  const total = rows.reduce((a, r) => a + r.available, 0);
  const income = state.expectedIncome;
  $('#budget-total').textContent = won(total);
  if (document.activeElement !== $('#expected-income')) $('#expected-income').value = income ? fmt(income) : '';
  const gap = income - total;
  $('#budget-callout').innerHTML = !total || !income ? '' : gap < 0
    ? `<div class="callout bad num">배정이 예상 월수입보다 ${fmt(-gap)}원 많아요</div>`
    : `<div class="callout good num">배정하고도 ${fmt(gap)}원이 남아요</div>`;
}

function renderDebt() {
  const list = [...state.debts].sort((a, b) => (Number(b.rate) || 0) - (Number(a.rate) || 0));
  const total = list.reduce((a, d) => a + Number(d.balance || 0), 0);
  const principal = list.reduce((a, d) => a + Number(d.principal || 0), 0);
  const monthly = list.reduce((a, d) => a + Number(d.monthly_payment || 0), 0);
  $('#debt-hero').innerHTML = `
    <div class="label">남은 부채</div>
    <div class="big num">${won(total)}</div>
    <div class="note num">처음 빌린 돈 ${won(principal)} 중 ${principal ? Math.round((1 - total / principal) * 100) : 0}% 갚았어요</div>
    <div class="split">
      <div><div class="k">월 납입 예정</div><div class="v num">${won(monthly)}</div></div>
      <div><div class="k">대출 수</div><div class="v num">${list.length}건</div></div>
    </div>`;
  $('#debt-list').innerHTML = list.map(d => {
    const paid = d.principal ? Math.max(0, Math.min(100, (1 - Number(d.balance) / Number(d.principal)) * 100)) : 0;
    const meta = [
      d.monthly_payment ? `월 ${won(d.monthly_payment)}` : '월 납입액 미확인',
      d.due_day ? `매월 ${d.due_day}일` : '납부일 미확인',
      d.balance_checked_on ? `${mmdd(d.balance_checked_on)} 확인` : null,
    ].filter(Boolean).join(' · ');
    return `<div class="debt">
      <div class="line"><span class="name">${esc(d.id)} · ${esc(d.product)}</span>
        <span class="rate num ${Number(d.rate) >= 15 ? 'high' : ''}">${d.rate != null ? '연 ' + Number(d.rate) + '%' : '금리 미확인'}</span></div>
      <div class="bal num">${won(d.balance)}</div>
      <div class="track"><i style="width:${paid}%"></i></div>
      <div class="meta num"><span>${esc(meta)}</span><button class="link" type="button" data-debt="${esc(d.id)}">잔액 갱신</button></div>
    </div>`;
  }).join('');
}

async function renderNotes() {
  const { data, error } = await sb.from('notes').select('*').order('id');
  if (error) return fail(error);
  const sections = new Map();
  for (const n of data) {
    if (!sections.has(n.section)) sections.set(n.section, []);
    sections.get(n.section).push(n);
  }
  $('#notes-list').innerHTML = [...sections].map(([s, list]) => `
    <div class="block"><div class="block-head"><h2>${esc(s)}</h2></div>
      ${list.map(n => `<div class="note"><div class="item">${esc(n.item)}</div><div class="content">${esc(n.content)}</div></div>`).join('')}
    </div>`).join('');
}

// 이동 ---------------------------------------------------------------

const VIEW_TITLES = { debt: '부채', notes: '메모', chores: '집안일' };

function go(view) {
  state.view = view;
  for (const s of $$('section.view')) s.classList.toggle('hidden', s.id !== 'view-' + view);
  for (const b of $$('nav.tabs button')) {
    if (b.dataset.view === view) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  }
  $('#add-tx').classList.toggle('hidden', !['home', 'tx'].includes(view));
  const fixedTitle = VIEW_TITLES[view];
  $('#month-picker').classList.toggle('hidden', !!fixedTitle);
  $('#view-title').classList.toggle('hidden', !fixedTitle);
  $('#view-title').textContent = fixedTitle || '';
  if (view === 'notes') renderNotes();
  window.scrollTo(0, 0);
}

$$('nav.tabs button').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
$('#month-picker').addEventListener('click', e => {
  const step = Number(e.target.closest('[data-step]')?.dataset.step);
  if (!step) return;
  state.month = shiftMonth(state.month, step);
  loadMonth();
});
$('#summary-rows').addEventListener('click', e => {
  const target = e.target.closest('[data-goto]')?.dataset.goto;
  if (target === 'debt') go('debt');
  if (target === 'review') { setTypeFilter('review'); go('tx'); }
});

function setTypeFilter(type) {
  state.filter.type = type;
  $$('#tx-type-chips button.chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.type === type)));
  renderTx();
}
$('#tx-type-chips').addEventListener('click', e => {
  const chip = e.target.closest('button.chip');
  if (chip) setTypeFilter(chip.dataset.type);
});
$('#tx-envelope').addEventListener('change', e => {
  state.filter.envelope = e.target.value;
  e.target.setAttribute('aria-pressed', String(!!e.target.value));
  renderTx();
});
$('#tx-search').addEventListener('input', e => { state.filter.q = e.target.value; renderTx(); });

document.addEventListener('click', e => {
  const row = e.target.closest('.row[data-id]');
  if (row) openTx(state.tx.find(t => t.id === row.dataset.id));
  const debtBtn = e.target.closest('[data-debt]');
  if (debtBtn) openDebt(state.debts.find(d => d.id === debtBtn.dataset.debt));
});

// 거래 입력 -----------------------------------------------------------

function setFormType(type) {
  state.formType = type;
  $$('#f-type button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === type)));
  syncDebtField();
}
$('#f-type').addEventListener('click', e => { if (e.target.dataset.v) setFormType(e.target.dataset.v); });

function syncDebtField() {
  $('#f-debt-wrap').classList.toggle('hidden', $('#f-envelope').value !== '부채상환');
}
$('#f-envelope').addEventListener('change', syncDebtField);

for (const id of ['#f-amount', '#d-balance', '#d-pay']) {
  $(id).addEventListener('input', e => {
    const n = parseAmount(e.target.value);
    e.target.value = n ? fmt(n) : '';
  });
}

function matchRule(desc) {
  const d = desc.toLowerCase();
  return state.rules.find(r => d.includes(r.keyword.toLowerCase()));
}

$('#f-desc').addEventListener('input', () => {
  if (state.editing) return;
  const r = matchRule($('#f-desc').value);
  if (!r) { $('#f-hint').textContent = ''; return; }
  if (r.type) setFormType(r.type);
  $('#f-envelope').value = r.envelope || '';
  $('#f-cat').value = r.category || '';
  $('#f-sub').value = r.subcategory || '';
  if (r.default_payment) $('#f-pay').value = r.default_payment;
  if (r.debt_id) $('#f-debt').value = r.debt_id;
  syncDebtField();
  $('#f-hint').textContent = `‘${r.keyword}’ 규칙으로 채웠어요`;
});

function openTx(t) {
  state.editing = t || null;
  $('#tx-dialog-title').textContent = t ? '기록 고치기' : '기록하기';
  $('#tx-delete').classList.toggle('hidden', !t);
  $('#f-hint').textContent = '';
  setFormType(t?.type || '지출');
  $('#f-desc').value = t?.description || '';
  $('#f-date').value = t?.date || (state.month === today().slice(0, 7) ? today() : `${state.month}-01`);
  $('#f-amount').value = t ? fmt(t.amount) : '';
  $('#f-envelope').value = t?.envelope || '';
  $('#f-pay').value = t?.payment_method || '';
  $('#f-cat').value = t?.category || '';
  $('#f-sub').value = t?.subcategory || '';
  $('#f-debt').value = t?.debt_id || '';
  $('#f-tags').value = (t?.tags || []).join(', ');
  $('#f-memo').value = t?.memo || '';
  $('#f-review').checked = !!t?.needs_review;
  $('#f-oneoff').checked = !!t?.one_off;
  syncDebtField();
  $('#tx-dialog').showModal();
  if (!t) $('#f-amount').focus();
}

$('#add-tx').addEventListener('click', () => openTx(null));
$('#tx-cancel').addEventListener('click', () => $('#tx-dialog').close());

async function nextId(date) {
  const { start, end } = monthRange(date.slice(0, 7));
  const { count, error } = await sb.from('transactions').select('id', { count: 'exact', head: true })
    .gte('date', start).lt('date', end);
  if (error) throw error;
  return n => `TX-${date.replaceAll('-', '')}-${String(count + n).padStart(3, '0')}`;
}

$('#tx-form').addEventListener('submit', async e => {
  e.preventDefault();
  const amount = parseAmount($('#f-amount').value);
  if (!amount) return toast('금액을 입력해 주세요');
  const envelope = $('#f-envelope').value || null;
  const row = {
    date: $('#f-date').value,
    description: $('#f-desc').value.trim(),
    type: state.formType,
    amount,
    envelope,
    category: $('#f-cat').value.trim() || null,
    subcategory: $('#f-sub').value.trim() || null,
    payment_method: $('#f-pay').value.trim() || null,
    debt_id: envelope === '부채상환' ? ($('#f-debt').value || null) : null,
    memo: $('#f-memo').value.trim() || null,
    needs_review: $('#f-review').checked,
    one_off: $('#f-oneoff').checked,
    tags: $('#f-tags').value.split(',').map(s => s.trim()).filter(Boolean),
  };
  if (row.type === '지출' && !row.envelope) return toast('지출은 봉투를 골라 주세요');
  const btn = $('#tx-save');
  btn.disabled = true;
  try {
    if (state.editing) {
      const { error } = await sb.from('transactions').update(row).eq('id', state.editing.id);
      if (error) throw error;
    } else {
      const makeId = await nextId(row.date);
      let saved = false;
      for (let n = 1; n <= 5 && !saved; n++) {
        const { error } = await sb.from('transactions').insert({ ...row, id: makeId(n), source: '앱 입력' });
        if (!error) saved = true;
        else if (error.code !== '23505') throw error;
      }
      if (!saved) throw new Error('거래 번호를 만들지 못했어요. 다시 시도해 주세요');
    }
    $('#tx-dialog').close();
    toast('저장했어요');
    if (row.date.slice(0, 7) !== state.month) state.month = row.date.slice(0, 7);
    await loadMonth();
  } catch (err) {
    fail(err);
  } finally {
    btn.disabled = false;
  }
});

$('#tx-delete').addEventListener('click', async () => {
  const t = state.editing;
  if (!t || !confirm(`‘${t.description}’ ${won(t.amount)} 기록을 지울까요?`)) return;
  const { error } = await sb.from('transactions').delete().eq('id', t.id);
  if (error) return fail(error);
  $('#tx-dialog').close();
  toast('지웠어요');
  loadMonth();
});

// 봉투 배정 -----------------------------------------------------------

$('#budget-list').addEventListener('input', e => {
  if (!e.target.matches('.alloc')) return;
  const n = parseAmount(e.target.value);
  e.target.value = n ? fmt(n) : '';
});
$('#budget-list').addEventListener('change', async e => {
  if (!e.target.matches('.alloc')) return;
  const { start } = monthRange(state.month);
  const { error } = await sb.from('budgets').upsert(
    { month: start, envelope: e.target.dataset.env, allocated: parseAmount(e.target.value) },
    { onConflict: 'month,envelope' });
  if (error) return fail(error);
  toast(`${e.target.dataset.env} 배정액을 저장했어요`);
  loadMonth();
});
$('#expected-income').addEventListener('input', e => {
  const n = parseAmount(e.target.value);
  e.target.value = n ? fmt(n) : '';
});
$('#expected-income').addEventListener('change', async e => {
  const value = parseAmount(e.target.value);
  const { error } = await sb.from('settings').upsert({ key: 'expected_monthly_income', value, updated_at: new Date().toISOString() });
  if (error) return fail(error);
  state.expectedIncome = value;
  toast('예상 월수입을 저장했어요');
  renderBudget();
});
$('#copy-budget').addEventListener('click', async () => {
  const prev = monthRange(shiftMonth(state.month, -1)).start;
  const { start } = monthRange(state.month);
  const { data, error } = await sb.from('budgets').select('envelope, allocated').eq('month', prev);
  if (error) return fail(error);
  if (!data.length) return toast('지난달 배정이 없어요');
  if (state.budgets.some(b => Number(b.available)) && !confirm('이번 달 배정액을 지난달 값으로 덮어쓸까요?')) return;
  const { error: e2 } = await sb.from('budgets').upsert(
    data.map(d => ({ month: start, envelope: d.envelope, allocated: d.allocated })), { onConflict: 'month,envelope' });
  if (e2) return fail(e2);
  toast('지난달 배정을 복사했어요');
  loadMonth();
});

// 부채 갱신 -----------------------------------------------------------

function openDebt(d) {
  state.editingDebt = d;
  $('#debt-dialog-title').textContent = `${d.id} · ${d.product}`;
  $('#d-balance').value = fmt(d.balance);
  $('#d-next').value = d.next_due || '';
  $('#d-pay').value = d.monthly_payment ? fmt(d.monthly_payment) : '';
  $('#d-memo').value = d.memo || '';
  $('#debt-dialog').showModal();
}
$('#debt-cancel').addEventListener('click', () => $('#debt-dialog').close());
$('#debt-form').addEventListener('submit', async e => {
  e.preventDefault();
  const d = state.editingDebt;
  const { error } = await sb.from('debts').update({
    balance: parseAmount($('#d-balance').value),
    next_due: $('#d-next').value || null,
    monthly_payment: parseAmount($('#d-pay').value) || null,
    memo: $('#d-memo').value.trim() || null,
    balance_checked_on: today(),
    updated_at: new Date().toISOString(),
  }).eq('id', d.id);
  if (error) return fail(error);
  $('#debt-dialog').close();
  toast('잔액을 갱신했어요');
  loadMonth();
});

for (const dlg of $$('dialog')) {
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !$('#app').classList.contains('hidden')) loadMonth();
});

start().catch(fail);
</script>
</body>
</html>
