<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f3ee">
<title>우리집 가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f3ee;
  --surface: #ffffff;
  --surface-2: #efebe4;
  --text: #24211d;
  --muted: #776f65;
  --line: #e2ddd4;
  --accent: #2f6f5e;
  --accent-soft: #dcebe5;
  --income: #2f6f5e;
  --expense: #b0472f;
  --move: #6b6a9a;
  --warn: #b7791f;
  --warn-soft: #f8ecd6;
  --danger: #b0472f;
  --bar: #2f6f5e;
  --bar-over: #b0472f;
  --shadow: 0 1px 2px rgba(36, 33, 29, .06), 0 4px 16px rgba(36, 33, 29, .05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171614;
    --surface: #211f1c;
    --surface-2: #2b2925;
    --text: #ece7df;
    --muted: #a39b90;
    --line: #36332e;
    --accent: #6fbfa6;
    --accent-soft: #23362f;
    --income: #6fbfa6;
    --expense: #e58a72;
    --move: #a9a8d8;
    --warn: #e2b062;
    --warn-soft: #3a3020;
    --danger: #e58a72;
    --bar: #6fbfa6;
    --bar-over: #e58a72;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171614; --surface: #211f1c; --surface-2: #2b2925; --text: #ece7df; --muted: #a39b90;
  --line: #36332e; --accent: #6fbfa6; --accent-soft: #23362f; --income: #6fbfa6; --expense: #e58a72;
  --move: #a9a8d8; --warn: #e2b062; --warn-soft: #3a3020; --danger: #e58a72; --bar: #6fbfa6;
  --bar-over: #e58a72; --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 "Noto Sans KR", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }

.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }

header.top {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
header.top .wrap { display: flex; align-items: center; gap: 8px; height: 56px; }
header.top h1 { font-size: 17px; margin: 0; flex: 1; font-weight: 700; }
.month {
  display: flex; align-items: center; gap: 2px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px;
}
.month button { border: 0; background: none; width: 30px; height: 30px; border-radius: 999px; }
.month button:hover { background: var(--surface-2); }
.month span { min-width: 74px; text-align: center; font-weight: 500; }
.icon-btn { border: 0; background: none; color: var(--muted); padding: 6px 8px; border-radius: 8px; }
.icon-btn:hover { background: var(--surface-2); }

main { padding: 16px 0 24px; }
section.view > h2 { font-size: 15px; color: var(--muted); font-weight: 500; margin: 24px 0 8px; }
section.view > h2:first-child { margin-top: 0; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: var(--shadow); padding: 16px;
}

.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat { padding: 14px; }
.stat .label { color: var(--muted); font-size: 13px; }
.stat .value { font-size: 20px; font-weight: 700; margin-top: 2px; }
.stat .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.stat.wide { grid-column: 1 / -1; }
.stat.link { cursor: pointer; }
.stat.attention { background: var(--warn-soft); border-color: transparent; }
.stat.attention .value { color: var(--warn); }
.pos { color: var(--income); }
.neg { color: var(--expense); }

.env-list { display: flex; flex-direction: column; gap: 14px; }
.env-row .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.env-row .name { font-weight: 500; }
.env-row .amt { color: var(--muted); font-size: 13px; }
.env-row .amt b { color: var(--text); font-weight: 500; }
.bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; background: var(--bar); border-radius: 999px; }
.bar.over > i { background: var(--bar-over); }
.env-row .left { font-size: 12px; margin-top: 4px; color: var(--muted); }
.env-row .left.neg { color: var(--expense); }

.alloc-input {
  width: 120px; text-align: right; padding: 6px 8px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--bg);
}
.budget-total { display: flex; justify-content: space-between; padding-top: 12px; margin-top: 12px; border-top: 1px solid var(--line); }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: 13px;
}
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.search {
  flex: 1 1 160px; min-width: 0; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface);
}
select.filter { padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 13px; }

.day { margin-bottom: 14px; }
.day-head { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 0 4px 6px; }
.tx-list { padding: 0; overflow: hidden; }
.tx {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 14px;
  border-bottom: 1px solid var(--line); cursor: pointer; width: 100%; text-align: left;
  background: none; border-left: 0; border-right: 0; border-top: 0;
}
.tx:last-child { border-bottom: 0; }
.tx:hover { background: var(--surface-2); }
.tx .desc { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .meta { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .amount { font-weight: 700; text-align: right; }
.tx .amount.in { color: var(--income); }
.tx .amount.move { color: var(--move); font-weight: 500; }
.tx .badges { display: flex; gap: 4px; justify-content: flex-end; }
.badge { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.empty { color: var(--muted); text-align: center; padding: 32px 0; }

.debt { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.debt + .debt { margin-top: 10px; }
.debt .title { font-weight: 500; }
.debt .rate { font-weight: 700; }
.debt .rate.high { color: var(--expense); }
.debt .meta { color: var(--muted); font-size: 12px; grid-column: 1 / -1; }
.debt .bal { font-size: 18px; font-weight: 700; }
.debt .progress { grid-column: 1 / -1; }
.debt button.link { border: 0; background: none; color: var(--accent); padding: 0; font-size: 13px; }

.note-section + .note-section { margin-top: 10px; }
.note-section h3 { font-size: 14px; margin: 0 0 8px; }
.note { padding: 8px 0; border-top: 1px solid var(--line); }
.note:first-of-type { border-top: 0; padding-top: 0; }
.note .item { font-weight: 500; font-size: 13px; }
.note .content { font-size: 13px; color: var(--muted); white-space: pre-wrap; }

nav.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 6;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs .wrap { display: flex; }
nav.tabs button {
  flex: 1; border: 0; background: none; padding: 10px 0 12px; font-size: 12px; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 500; }

.fab {
  position: fixed; right: max(16px, calc(50vw - 344px)); bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 6;
  width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--accent); color: #fff;
  font-size: 28px; line-height: 1; box-shadow: 0 6px 20px rgba(0,0,0,.18);
}

dialog {
  border: 0; padding: 0; border-radius: 18px; background: var(--surface); color: var(--text);
  width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 32px);
}
dialog::backdrop { background: rgba(0,0,0,.35); }
.sheet { padding: 20px; overflow: auto; max-height: calc(100vh - 32px); }
.sheet h3 { margin: 0 0 16px; font-size: 17px; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.form label.full { grid-column: 1 / -1; }
.form input, .form select, .form textarea {
  padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); width: 100%;
}
.form textarea { min-height: 72px; resize: vertical; }
.form .check { flex-direction: row; align-items: center; gap: 8px; color: var(--text); }
.form .check input { width: auto; }
.seg { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; }
.seg button { flex: 1; border: 0; background: none; padding: 7px 0; border-radius: 8px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 500; box-shadow: var(--shadow); }
.hint { font-size: 12px; color: var(--accent); min-height: 18px; grid-column: 1 / -1; }
.actions { display: flex; gap: 8px; margin-top: 20px; }
.actions .spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 10px; }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .5; cursor: default; }

.login { max-width: 380px; margin: 12vh auto 0; }
.login h1 { font-size: 22px; margin: 0 0 4px; }
.login p { color: var(--muted); margin: 0 0 20px; }
.login form { display: flex; flex-direction: column; gap: 10px; }
.login input { padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.msg { font-size: 13px; color: var(--muted); min-height: 20px; }
.msg.error { color: var(--danger); }

.toast {
  position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20;
  opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; }

.placeholder { text-align: center; color: var(--muted); padding: 48px 16px; }
.placeholder b { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }

@media (min-width: 560px) {
  .stats { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>

<div id="login" class="wrap hidden">
  <div class="login">
    <h1>우리집 가계부</h1>
    <p>등록된 이메일로 로그인 링크를 보내 드려요.</p>
    <form id="login-form">
      <input id="login-email" type="email" required placeholder="이메일" autocomplete="email">
      <button class="btn primary" type="submit">로그인 링크 받기</button>
    </form>
    <div id="login-msg" class="msg"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="wrap">
      <h1>우리집</h1>
      <div class="month" id="month-picker">
        <button type="button" data-step="-1" aria-label="이전 달">‹</button>
        <span id="month-label" class="num"></span>
        <button type="button" data-step="1" aria-label="다음 달">›</button>
      </div>
      <button class="icon-btn" id="logout" type="button" title="로그아웃">나가기</button>
    </div>
  </header>

  <main class="wrap">
    <section class="view" id="view-home">
      <div class="stats" id="stats"></div>
      <h2>봉투</h2>
      <div class="card env-list" id="home-envelopes"></div>
      <h2>최근 거래</h2>
      <div class="card tx-list" id="home-recent"></div>
    </section>

    <section class="view hidden" id="view-tx">
      <div class="toolbar">
        <input class="search" id="tx-search" type="search" placeholder="내용·메모 검색">
        <select class="filter" id="tx-envelope"><option value="">모든 봉투</option></select>
      </div>
      <div class="toolbar" id="tx-type-chips">
        <button class="chip" data-type="" aria-pressed="true">전체</button>
        <button class="chip" data-type="지출" aria-pressed="false">지출</button>
        <button class="chip" data-type="수입" aria-pressed="false">수입</button>
        <button class="chip" data-type="이동" aria-pressed="false">이동</button>
        <button class="chip" data-type="review" aria-pressed="false">검토 필요</button>
      </div>
      <div id="tx-days"></div>
    </section>

    <section class="view hidden" id="view-budget">
      <h2>봉투별 배정액</h2>
      <div class="card">
        <div class="env-list" id="budget-list"></div>
        <div class="budget-total"><span>배정 합계</span><b class="num" id="budget-total"></b></div>
        <div class="budget-total"><span>이번 달 수입(일회성 제외)</span><b class="num" id="budget-income"></b></div>
      </div>
      <div class="actions"><button class="btn" id="copy-budget" type="button">지난달 배정 복사</button></div>
    </section>

    <section class="view hidden" id="view-debt">
      <div class="stats" id="debt-stats"></div>
      <h2>금리 높은 순</h2>
      <div id="debt-list"></div>
    </section>

    <section class="view hidden" id="view-notes">
      <div id="notes-list"></div>
    </section>

    <section class="view hidden" id="view-chores">
      <div class="card placeholder"><b>집안일</b>준비 중이에요. 가계부가 자리 잡으면 이 칸에 붙일게요.</div>
    </section>
  </main>

  <button class="fab" id="add-tx" type="button" aria-label="거래 추가">+</button>

  <nav class="tabs">
    <div class="wrap">
      <button type="button" data-view="home" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
      <button type="button" data-view="tx">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>거래</button>
      <button type="button" data-view="budget">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 9l9 5 9-5"/></svg>봉투</button>
      <button type="button" data-view="debt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>부채</button>
      <button type="button" data-view="notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7"/></svg>메모</button>
      <button type="button" data-view="chores">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12l4 4 10-10"/></svg>집안일</button>
    </div>
  </nav>
</div>

<dialog id="tx-dialog">
  <form class="sheet" id="tx-form" method="dialog">
    <h3 id="tx-dialog-title">거래 추가</h3>
    <div class="form">
      <div class="full seg" id="f-type">
        <button type="button" data-v="지출" aria-pressed="true">지출</button>
        <button type="button" data-v="수입" aria-pressed="false">수입</button>
        <button type="button" data-v="이동" aria-pressed="false">이동</button>
      </div>
      <label class="full">내용<input id="f-desc" required autocomplete="off" placeholder="예: 쿠팡이츠 마라탕"></label>
      <div class="hint" id="f-hint"></div>
      <label>날짜<input id="f-date" type="date" required></label>
      <label>금액<input id="f-amount" type="text" inputmode="numeric" required placeholder="0" class="num"></label>
      <label>봉투<select id="f-envelope"><option value="">없음</option></select></label>
      <label>결제수단<input id="f-pay" list="dl-pay" autocomplete="off"></label>
      <label>중분류<input id="f-cat" list="dl-cat" autocomplete="off"></label>
      <label>소분류<input id="f-sub" list="dl-sub" autocomplete="off"></label>
      <label id="f-debt-wrap" class="full hidden">대출<select id="f-debt"><option value="">선택 안 함</option></select></label>
      <label class="full">태그 (쉼표로 구분)<input id="f-tags" list="dl-tags" autocomplete="off" placeholder="이사, 사이드 프로젝트"></label>
      <label class="full">메모<textarea id="f-memo"></textarea></label>
      <label class="check"><input id="f-review" type="checkbox">검토 필요</label>
      <label class="check"><input id="f-oneoff" type="checkbox">일회성</label>
    </div>
    <div class="actions">
      <button class="btn danger hidden" id="tx-delete" type="button">삭제</button>
      <span class="spacer"></span>
      <button class="btn" type="button" id="tx-cancel">취소</button>
      <button class="btn primary" type="submit" id="tx-save">저장</button>
    </div>
  </form>
</dialog>

<dialog id="debt-dialog">
  <form class="sheet" id="debt-form" method="dialog">
    <h3 id="debt-dialog-title">잔액 갱신</h3>
    <div class="form">
      <label class="full">현재 잔액<input id="d-balance" inputmode="numeric" class="num" required></label>
      <label>다음 납부일<input id="d-next" type="date"></label>
      <label>월 납입액<input id="d-pay" inputmode="numeric" class="num"></label>
      <label class="full">메모<textarea id="d-memo"></textarea></label>
    </div>
    <div class="actions">
      <span class="spacer"></span>
      <button class="btn" type="button" id="debt-cancel">취소</button>
      <button class="btn primary" type="submit">저장</button>
    </div>
  </form>
</dialog>

<datalist id="dl-pay"></datalist>
<datalist id="dl-cat"></datalist>
<datalist id="dl-sub"></datalist>
<datalist id="dl-tags"></datalist>

<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';

const SUPABASE_URL = 'https://twrcgrflwvwljdyhxuwr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_vPIV6UrupvcFQUEvp_be3w_VkcjhQAT';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const won = n => (n == null ? '-' : Math.round(Number(n)).toLocaleString('ko-KR') + '원');
const signedWon = n => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(Math.round(n)).toLocaleString('ko-KR') + '원';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const parseAmount = s => Number(String(s).replace(/[^\d]/g, '')) || 0;
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const weekday = iso => '일월화수목금토'[new Date(iso + 'T00:00:00').getDay()];

const state = {
  month: today().slice(0, 7),
  view: 'home',
  envelopes: [],
  rules: [],
  debts: [],
  tx: [],
  budgets: [],
  summary: null,
  filter: { type: '', envelope: '', q: '' },
  editing: null,
  formType: '지출',
};

function monthRange(m) {
  const [y, mo] = m.split('-').map(Number);
  const next = mo === 12 ? `${y + 1}-01` : `${y}-${pad(mo + 1)}`;
  return { start: `${m}-01`, end: `${next}-01` };
}
function shiftMonth(m, step) {
  const [y, mo] = m.split('-').map(Number);
  const d = new Date(y, mo - 1 + step, 1);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
}

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}
function fail(err) {
  console.error(err);
  toast('문제가 생겼어요: ' + (err.message || err));
}

// 로그인 ---------------------------------------------------------------

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  const { data: ok, error } = await sb.rpc('is_member');
  if (error) return fail(error);
  if (!ok) {
    showLogin(`${session.user.email}은 등록되지 않은 이메일이에요.`, true);
    await sb.auth.signOut();
    return;
  }
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  await loadStatic();
  await loadMonth();
}

function showLogin(msg = '', error = false) {
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  const m = $('#login-msg');
  m.textContent = msg;
  m.classList.toggle('error', error);
}

$('#login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('#login-email').value.trim();
  const btn = e.submitter;
  btn.disabled = true;
  const redirect = location.origin + location.pathname;
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: redirect } });
  btn.disabled = false;
  if (error) return showLogin(error.message, true);
  showLogin('메일함을 확인해 주세요. 링크를 누르면 바로 들어와요.');
});

$('#logout').addEventListener('click', async () => {
  await sb.auth.signOut();
  showLogin();
});

sb.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_IN' && $('#app').classList.contains('hidden')) start();
});

// 데이터 ---------------------------------------------------------------

async function loadStatic() {
  const [env, rules, debts, dl] = await Promise.all([
    sb.from('envelopes').select('*').order('sort_order'),
    sb.from('rules').select('*'),
    sb.from('debts').select('*'),
    sb.from('transactions').select('payment_method, category, subcategory, tags').order('date', { ascending: false }).limit(1000),
  ]);
  for (const r of [env, rules, debts, dl]) if (r.error) throw r.error;
  state.envelopes = env.data;
  state.rules = rules.data.sort((a, b) => b.keyword.length - a.keyword.length);
  state.debts = debts.data;

  const uniq = key => [...new Set(dl.data.map(r => r[key]).filter(Boolean))].sort();
  fillDatalist('#dl-pay', uniq('payment_method'));
  fillDatalist('#dl-cat', uniq('category'));
  fillDatalist('#dl-sub', uniq('subcategory'));
  fillDatalist('#dl-tags', [...new Set(dl.data.flatMap(r => r.tags || []))].sort());

  const opts = state.envelopes.map(e => `<option>${esc(e.name)}</option>`).join('');
  $('#f-envelope').innerHTML = '<option value="">없음</option>' + opts;
  $('#tx-envelope').innerHTML = '<option value="">모든 봉투</option>' + opts;
  $('#f-debt').innerHTML = '<option value="">선택 안 함</option>' +
    state.debts.map(d => `<option value="${esc(d.id)}">${esc(d.id)} · ${esc(d.product)}</option>`).join('');
}

function fillDatalist(sel, values) {
  $(sel).innerHTML = values.map(v => `<option value="${esc(v)}">`).join('');
}

async function loadMonth() {
  $('#month-label').textContent = state.month.replace('-', '. ');
  const { start, end } = monthRange(state.month);
  const [tx, budgets, summary, debts] = await Promise.all([
    sb.from('transactions').select('*').gte('date', start).lt('date', end)
      .order('date', { ascending: false }).order('id', { ascending: false }),
    sb.from('monthly_envelope_summary').select('*').eq('month', start),
    sb.from('monthly_summary').select('*').eq('month', start).maybeSingle(),
    sb.from('debts').select('*'),
  ]);
  for (const r of [tx, budgets, summary, debts]) if (r.error) return fail(r.error);
  state.tx = tx.data;
  state.budgets = budgets.data;
  state.summary = summary.data;
  state.debts = debts.data;
  render();
}

// 화면 ---------------------------------------------------------------

function render() {
  renderHome();
  renderTx();
  renderBudget();
  renderDebt();
}

function envelopeRows() {
  const spent = {};
  for (const t of state.tx) if (t.type === '지출' && t.envelope) spent[t.envelope] = (spent[t.envelope] || 0) + Number(t.amount);
  const byName = Object.fromEntries(state.budgets.map(b => [b.envelope, b]));
  return state.envelopes.map(e => {
    const b = byName[e.name];
    const available = b ? Number(b.available) : 0;
    const s = spent[e.name] || 0;
    return { name: e.name, available, spent: s, remaining: available - s };
  });
}

function envRowHtml(r, withInput = false) {
  const pct = r.available > 0 ? Math.min(100, (r.spent / r.available) * 100) : (r.spent > 0 ? 100 : 0);
  const over = r.spent > r.available;
  const right = withInput
    ? `<input class="alloc-input num" data-env="${esc(r.name)}" inputmode="numeric" value="${r.available ? r.available.toLocaleString('ko-KR') : ''}" placeholder="0">`
    : `<span class="amt num"><b>${won(r.spent)}</b> / ${r.available ? won(r.available) : '배정 없음'}</span>`;
  const left = r.available
    ? (over ? `${won(-r.remaining)} 초과` : `${won(r.remaining)} 남음`)
    : (withInput ? `사용 ${won(r.spent)}` : '');
  return `<div class="env-row">
    <div class="head"><span class="name">${esc(r.name)}</span>${right}</div>
    <div class="bar ${over ? 'over' : ''}"><i style="width:${pct}%"></i></div>
    <div class="left num ${over && r.available ? 'neg' : ''}">${left}</div>
  </div>`;
}

function renderHome() {
  const s = state.summary || {};
  const income = Number(s.income || 0), expense = Number(s.expense || 0);
  const incomeR = Number(s.income_regular || 0), expenseR = Number(s.expense_regular || 0);
  const debtTotal = state.debts.reduce((a, d) => a + Number(d.balance || 0), 0);
  const review = Number(s.review_count || 0);
  const net = income - expense, netR = incomeR - expenseR;
  $('#stats').innerHTML = `
    <div class="card stat"><div class="label">수입</div><div class="value num pos">${won(income)}</div></div>
    <div class="card stat"><div class="label">지출</div><div class="value num">${won(expense)}</div></div>
    <div class="card stat"><div class="label">평소 수지</div>
      <div class="value num ${netR < 0 ? 'neg' : 'pos'}">${signedWon(netR)}</div>
      <div class="sub num">일회성 포함 ${signedWon(net)}</div></div>
    <div class="card stat"><div class="label">이번 달 부채상환</div><div class="value num">${won(s.debt_repaid || 0)}</div></div>
    <div class="card stat link" data-goto="debt"><div class="label">남은 부채</div><div class="value num">${won(debtTotal)}</div></div>
    <div class="card stat link ${review ? 'attention' : ''}" data-goto="review"><div class="label">검토 필요</div><div class="value num">${review}건</div></div>`;
  $('#home-envelopes').innerHTML = envelopeRows().filter(r => r.available || r.spent).map(r => envRowHtml(r)).join('')
    || '<div class="empty">이번 달 기록이 없어요</div>';
  $('#home-recent').innerHTML = state.tx.slice(0, 6).map(txHtml).join('') || '<div class="empty">거래가 없어요</div>';
}

function txHtml(t) {
  const cls = t.type === '수입' ? 'in' : t.type === '이동' ? 'move' : '';
  const sign = t.type === '수입' ? '+' : t.type === '이동' ? '' : '−';
  const meta = [t.envelope, t.subcategory || t.category, t.payment_method].filter(Boolean).join(' · ');
  const badges = [
    t.needs_review ? '<span class="badge warn">검토</span>' : '',
    t.one_off ? '<span class="badge">일회성</span>' : '',
    t.type === '이동' ? '<span class="badge">이동</span>' : '',
    ...(t.tags || []).map(g => `<span class="badge">${esc(g)}</span>`),
  ].join('');
  return `<button class="tx" type="button" data-id="${esc(t.id)}">
    <span class="desc">${esc(t.description)}</span>
    <span class="amount num ${cls}">${sign}${Number(t.amount).toLocaleString('ko-KR')}</span>
    <span class="meta">${esc(meta)}</span>
    <span class="badges">${badges}</span>
  </button>`;
}

function renderTx() {
  const { type, envelope, q } = state.filter;
  const needle = q.trim().toLowerCase();
  const rows = state.tx.filter(t =>
    (!type || (type === 'review' ? t.needs_review : t.type === type)) &&
    (!envelope || t.envelope === envelope) &&
    (!needle || `${t.description} ${t.memo || ''} ${(t.tags || []).join(' ')}`.toLowerCase().includes(needle)));
  const days = new Map();
  for (const t of rows) {
    if (!days.has(t.date)) days.set(t.date, []);
    days.get(t.date).push(t);
  }
  $('#tx-days').innerHTML = [...days].map(([d, list]) => {
    const out = list.filter(t => t.type === '지출').reduce((a, t) => a + Number(t.amount), 0);
    const [, m, dd] = d.split('-');
    return `<div class="day">
      <div class="day-head"><span>${Number(m)}월 ${Number(dd)}일 (${weekday(d)})</span><span class="num">${out ? '−' + out.toLocaleString('ko-KR') : ''}</span></div>
      <div class="card tx-list">${list.map(txHtml).join('')}</div>
    </div>`;
  }).join('') || '<div class="empty">조건에 맞는 거래가 없어요</div>';
}

function renderBudget() {
  const rows = envelopeRows();
  $('#budget-list').innerHTML = rows.map(r => envRowHtml(r, true)).join('');
  $('#budget-total').textContent = won(rows.reduce((a, r) => a + r.available, 0));
  $('#budget-income').textContent = won(state.summary?.income_regular || 0);
}

function renderDebt() {
  const list = [...state.debts].sort((a, b) => (Number(b.rate) || 0) - (Number(a.rate) || 0));
  const total = list.reduce((a, d) => a + Number(d.balance || 0), 0);
  const monthly = list.reduce((a, d) => a + Number(d.monthly_payment || 0), 0);
  $('#debt-stats').innerHTML = `
    <div class="card stat"><div class="label">남은 부채</div><div class="value num">${won(total)}</div></div>
    <div class="card stat"><div class="label">월 납입 예정</div><div class="value num">${won(monthly)}</div></div>`;
  $('#debt-list').innerHTML = list.map(d => {
    const paid = d.principal ? Math.max(0, Math.min(100, (1 - Number(d.balance) / Number(d.principal)) * 100)) : 0;
    const meta = [
      d.monthly_payment ? `월 ${won(d.monthly_payment)}` : '월 납입액 미확인',
      d.due_day ? `매월 ${d.due_day}일` : '납부일 미확인',
      d.next_due ? `다음 ${d.next_due.slice(5).replace('-', '/')}` : null,
      d.balance_checked_on ? `잔액 확인 ${d.balance_checked_on.slice(5).replace('-', '/')}` : null,
    ].filter(Boolean).join(' · ');
    return `<div class="card debt">
      <div><div class="title">${esc(d.id)} · ${esc(d.product)}</div><div class="bal num">${won(d.balance)}</div></div>
      <div style="text-align:right"><div class="rate num ${Number(d.rate) >= 15 ? 'high' : ''}">${d.rate != null ? d.rate + '%' : '금리 미확인'}</div>
        <button class="link" type="button" data-debt="${esc(d.id)}">잔액 갱신</button></div>
      <div class="progress"><div class="bar"><i style="width:${paid}%"></i></div></div>
      <div class="meta num">${esc(meta)}</div>
    </div>`;
  }).join('');
}

async function renderNotes() {
  const { data, error } = await sb.from('notes').select('*').order('id');
  if (error) return fail(error);
  const sections = new Map();
  for (const n of data) {
    if (!sections.has(n.section)) sections.set(n.section, []);
    sections.get(n.section).push(n);
  }
  $('#notes-list').innerHTML = [...sections].map(([s, list]) => `
    <div class="card note-section"><h3>${esc(s)}</h3>
      ${list.map(n => `<div class="note"><div class="item">${esc(n.item)}</div><div class="content">${esc(n.content)}</div></div>`).join('')}
    </div>`).join('');
}

// 이동 ---------------------------------------------------------------

function go(view) {
  state.view = view;
  for (const s of $$('section.view')) s.classList.toggle('hidden', s.id !== 'view-' + view);
  for (const b of $$('nav.tabs button')) {
    if (b.dataset.view === view) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  }
  $('#add-tx').classList.toggle('hidden', !['home', 'tx'].includes(view));
  $('#month-picker').classList.toggle('hidden', ['debt', 'notes', 'chores'].includes(view));
  if (view === 'notes') renderNotes();
  window.scrollTo(0, 0);
}

$$('nav.tabs button').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
$('#month-picker').addEventListener('click', e => {
  const step = Number(e.target.dataset.step);
  if (!step) return;
  state.month = shiftMonth(state.month, step);
  loadMonth();
});
$('#stats').addEventListener('click', e => {
  const target = e.target.closest('[data-goto]')?.dataset.goto;
  if (target === 'debt') go('debt');
  if (target === 'review') { setTypeFilter('review'); go('tx'); }
});

function setTypeFilter(type) {
  state.filter.type = type;
  $$('#tx-type-chips .chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.type === type)));
  renderTx();
}
$('#tx-type-chips').addEventListener('click', e => { if (e.target.dataset.type !== undefined) setTypeFilter(e.target.dataset.type); });
$('#tx-envelope').addEventListener('change', e => { state.filter.envelope = e.target.value; renderTx(); });
$('#tx-search').addEventListener('input', e => { state.filter.q = e.target.value; renderTx(); });

document.addEventListener('click', e => {
  const row = e.target.closest('.tx[data-id]');
  if (row) openTx(state.tx.find(t => t.id === row.dataset.id));
  const debtBtn = e.target.closest('[data-debt]');
  if (debtBtn) openDebt(state.debts.find(d => d.id === debtBtn.dataset.debt));
});

// 거래 입력 -----------------------------------------------------------

function setFormType(type) {
  state.formType = type;
  $$('#f-type button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === type)));
  syncDebtField();
}
$('#f-type').addEventListener('click', e => { if (e.target.dataset.v) setFormType(e.target.dataset.v); });

function syncDebtField() {
  $('#f-debt-wrap').classList.toggle('hidden', $('#f-envelope').value !== '부채상환');
}
$('#f-envelope').addEventListener('change', syncDebtField);

$('#f-amount').addEventListener('input', e => {
  const n = parseAmount(e.target.value);
  e.target.value = n ? n.toLocaleString('ko-KR') : '';
});

function matchRule(desc) {
  const d = desc.toLowerCase();
  return state.rules.find(r => d.includes(r.keyword.toLowerCase()));
}

$('#f-desc').addEventListener('input', () => {
  if (state.editing) return;
  const r = matchRule($('#f-desc').value);
  if (!r) { $('#f-hint').textContent = ''; return; }
  if (r.type) setFormType(r.type);
  const fill = (sel, v) => { if (v) $(sel).value = v; };
  $('#f-envelope').value = r.envelope || '';
  $('#f-cat').value = r.category || '';
  $('#f-sub').value = r.subcategory || '';
  fill('#f-pay', r.default_payment);
  if (r.debt_id) $('#f-debt').value = r.debt_id;
  syncDebtField();
  $('#f-hint').textContent = `‘${r.keyword}’ 규칙으로 채웠어요`;
});

function openTx(t) {
  state.editing = t || null;
  $('#tx-dialog-title').textContent = t ? '거래 수정' : '거래 추가';
  $('#tx-delete').classList.toggle('hidden', !t);
  $('#f-hint').textContent = t ? t.id : '';
  setFormType(t?.type || '지출');
  $('#f-desc').value = t?.description || '';
  $('#f-date').value = t?.date || (state.month === today().slice(0, 7) ? today() : `${state.month}-01`);
  $('#f-amount').value = t ? Number(t.amount).toLocaleString('ko-KR') : '';
  $('#f-envelope').value = t?.envelope || '';
  $('#f-pay').value = t?.payment_method || '';
  $('#f-cat').value = t?.category || '';
  $('#f-sub').value = t?.subcategory || '';
  $('#f-debt').value = t?.debt_id || '';
  $('#f-tags').value = (t?.tags || []).join(', ');
  $('#f-memo').value = t?.memo || '';
  $('#f-review').checked = !!t?.needs_review;
  $('#f-oneoff').checked = !!t?.one_off;
  syncDebtField();
  $('#tx-dialog').showModal();
  if (!t) $('#f-desc').focus();
}

$('#add-tx').addEventListener('click', () => openTx(null));
$('#tx-cancel').addEventListener('click', () => $('#tx-dialog').close());

async function nextId(date) {
  const { start, end } = monthRange(date.slice(0, 7));
  const { count, error } = await sb.from('transactions').select('id', { count: 'exact', head: true })
    .gte('date', start).lt('date', end);
  if (error) throw error;
  return n => `TX-${date.replaceAll('-', '')}-${String(count + n).padStart(3, '0')}`;
}

$('#tx-form').addEventListener('submit', async e => {
  e.preventDefault();
  const amount = parseAmount($('#f-amount').value);
  if (!amount) return toast('금액을 입력해 주세요');
  const envelope = $('#f-envelope').value || null;
  const row = {
    date: $('#f-date').value,
    description: $('#f-desc').value.trim(),
    type: state.formType,
    amount,
    envelope,
    category: $('#f-cat').value.trim() || null,
    subcategory: $('#f-sub').value.trim() || null,
    payment_method: $('#f-pay').value.trim() || null,
    debt_id: envelope === '부채상환' ? ($('#f-debt').value || null) : null,
    memo: $('#f-memo').value.trim() || null,
    needs_review: $('#f-review').checked,
    one_off: $('#f-oneoff').checked,
    tags: $('#f-tags').value.split(',').map(s => s.trim()).filter(Boolean),
  };
  if (row.type === '지출' && !row.envelope) return toast('지출은 봉투를 골라 주세요');
  const btn = $('#tx-save');
  btn.disabled = true;
  try {
    if (state.editing) {
      const { error } = await sb.from('transactions').update(row).eq('id', state.editing.id);
      if (error) throw error;
    } else {
      const makeId = await nextId(row.date);
      let saved = false;
      for (let n = 1; n <= 5 && !saved; n++) {
        const { error } = await sb.from('transactions').insert({ ...row, id: makeId(n), source: '앱 입력' });
        if (!error) saved = true;
        else if (error.code !== '23505') throw error;
      }
      if (!saved) throw new Error('거래 번호를 만들지 못했어요. 다시 시도해 주세요');
    }
    $('#tx-dialog').close();
    toast('저장했어요');
    if (row.date.slice(0, 7) !== state.month) state.month = row.date.slice(0, 7);
    await loadMonth();
  } catch (err) {
    fail(err);
  } finally {
    btn.disabled = false;
  }
});

$('#tx-delete').addEventListener('click', async () => {
  const t = state.editing;
  if (!t || !confirm(`‘${t.description}’ ${won(t.amount)} 거래를 삭제할까요?`)) return;
  const { error } = await sb.from('transactions').delete().eq('id', t.id);
  if (error) return fail(error);
  $('#tx-dialog').close();
  toast('삭제했어요');
  loadMonth();
});

// 봉투 배정 -----------------------------------------------------------

$('#budget-list').addEventListener('input', e => {
  if (!e.target.matches('.alloc-input')) return;
  const n = parseAmount(e.target.value);
  e.target.value = n ? n.toLocaleString('ko-KR') : '';
});
$('#budget-list').addEventListener('change', async e => {
  if (!e.target.matches('.alloc-input')) return;
  const { start } = monthRange(state.month);
  const { error } = await sb.from('budgets').upsert(
    { month: start, envelope: e.target.dataset.env, allocated: parseAmount(e.target.value) },
    { onConflict: 'month,envelope' });
  if (error) return fail(error);
  toast(`${e.target.dataset.env} 배정액을 저장했어요`);
  loadMonth();
});
$('#copy-budget').addEventListener('click', async () => {
  const prev = monthRange(shiftMonth(state.month, -1)).start;
  const { start } = monthRange(state.month);
  const { data, error } = await sb.from('budgets').select('envelope, allocated').eq('month', prev);
  if (error) return fail(error);
  if (!data.length) return toast('지난달 배정이 없어요');
  if (state.budgets.some(b => Number(b.available)) && !confirm('이번 달 배정액을 지난달 값으로 덮어쓸까요?')) return;
  const { error: e2 } = await sb.from('budgets').upsert(
    data.map(d => ({ month: start, envelope: d.envelope, allocated: d.allocated })), { onConflict: 'month,envelope' });
  if (e2) return fail(e2);
  toast('지난달 배정을 복사했어요');
  loadMonth();
});

// 부채 갱신 -----------------------------------------------------------

function openDebt(d) {
  state.editingDebt = d;
  $('#debt-dialog-title').textContent = `${d.id} · ${d.product}`;
  $('#d-balance').value = Number(d.balance).toLocaleString('ko-KR');
  $('#d-next').value = d.next_due || '';
  $('#d-pay').value = d.monthly_payment ? Number(d.monthly_payment).toLocaleString('ko-KR') : '';
  $('#d-memo').value = d.memo || '';
  $('#debt-dialog').showModal();
}
$('#debt-cancel').addEventListener('click', () => $('#debt-dialog').close());
for (const id of ['#d-balance', '#d-pay']) {
  $(id).addEventListener('input', e => {
    const n = parseAmount(e.target.value);
    e.target.value = n ? n.toLocaleString('ko-KR') : '';
  });
}
$('#debt-form').addEventListener('submit', async e => {
  e.preventDefault();
  const d = state.editingDebt;
  const { error } = await sb.from('debts').update({
    balance: parseAmount($('#d-balance').value),
    next_due: $('#d-next').value || null,
    monthly_payment: parseAmount($('#d-pay').value) || null,
    memo: $('#d-memo').value.trim() || null,
    balance_checked_on: today(),
    updated_at: new Date().toISOString(),
  }).eq('id', d.id);
  if (error) return fail(error);
  $('#debt-dialog').close();
  toast('잔액을 갱신했어요');
  loadMonth();
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !$('#app').classList.contains('hidden')) loadMonth();
});

start().catch(fail);
</script>
</body>
</html>
